[package]
name = "monitor-brightness-control"
version = "0.1.0"
edition = "2021"
description = "A Windows DDC/CI monitor brightness and contrast controller"

[dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-winapi"] }
eframe = "0.33"
egui = "0.33"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
